# =============================================================================
# UEDumper configuration
# =============================================================================
#
# Place next to UEDumper.exe. Sections:
#   [General]  safety switches + memory backend selection
#   [DMA]      MemProcFS / LeechCore connection settings
#   [AOB]      signature scan (edit after game updates, no recompile needed)
#   [Offsets]  RVAs + structure layouts (numeric keys win over AOB results)
#
# After a game update:
#   1. Dump the new exe (any PE dumper) and open it in IDA
#   2. Resolve the RVAs in IDA and paste them into [Offsets] below.
#      AOB scanning runs only with SafeMode=0 and SkipAOB=0; numeric offsets
#      in this file always override its results.
#   3. SafeMode=1 prints the first 10 UObject names; if you see names like
#      "/Script/CoreUObject" or "Object", the offsets are correct
#   4. Set SafeMode=0 for the full SDK dump
#
# The values below are EXAMPLE values for one particular client build. They are
# not universal: any update can move every RVA and change the structure
# layouts. Always re-verify with SafeMode=1 before trusting a full dump.
# =============================================================================


# =============================================================================
[General]
# =============================================================================
# SafeMode = 1  validate the first 10 UObject names only (run this first
#               after any update)
# SafeMode = 0  full flow: module dump -> AOB -> FName -> GObject -> SDK
SafeMode = 1

# SkipAOB = 1   skip the signature scan, use this file / built-in defaults
# SkipAOB = 0   run the AOB scan in full mode (requires the module copy)
SkipAOB = 1

# Memory backend: "dma" = MemProcFS on the DMA host (default).
# "rpm" = ReadProcessMemory on the local machine.
Backend = dma


# =============================================================================
[DMA]
# =============================================================================
# PCILeech FPGA device URI.
DMA.Device = fpga://algo=0
# none = no explicit memory map, auto = target map,
# or a map file path relative to UEDumper.exe. Do not reuse another PC's map.
DMA.MemMap = none
# Set to 1 for MemProcFS initialization diagnostics.
DMA.Debug = 0
# 0 = select by full process name. Set a target PID if multiple copies run.
DMA.Pid = 0
# Optional LeechCore remote URI, if using a remote acquisition service.
# DMA.Remote = rpc://host


# =============================================================================
[AOB]
# =============================================================================
# Signature format: hex bytes, space separated, "? ?" as wildcard.
# DispOffset = byte distance from the match to the rip-relative disp32.
# RVA = match + DispOffset + 4 + sign_extend(disp32) - ImageBase
# The same signature can hit many sites (the GObjects signature matches
# 100+ call sites); the resolver picks the most frequent resolved RVA.
#
# These signatures are retained as update-time fallbacks. Revalidate them
# after any client update - a signature that still matches does not prove it
# still points at the same global.

# GUObjectArray: chunked object-array index computation sequence
AOB.GObjects.Sig = 3B 05 ? ? ? ? 7D 1E 8B C8 0F B7 C0 48 C1 E9 10 48 8D 14 40 48 8B 05 ? ? ? ? 48 8B 0C C8 48 8D 04 D1
AOB.GObjects.DispOffset = 0x18

# NumElements: leading cmp of the same signature (sanity check, must always
# equal GObjects+0x14)
AOB.NumElements.Sig = 3B 05 ? ? ? ? 7D 1E 8B C8 0F B7 C0 48 C1 E9 10 48 8D 14 40 48 8B 05 ? ? ? ? 48 8B 0C C8 48 8D 04 D1
AOB.NumElements.DispOffset = 0x2

# FNamePool: lea pointing at the pool object itself (lea rcx, [rip+GNames])
AOB.GNames.Sig = 48 8D 0D ? ? ? ? 0F 10 00 0F 11 44 24 40
AOB.GNames.DispOffset = 0x3

# GWorld: global read at the tail of the GetWorld fallback chain
AOB.GWorld.Sig = 48 8B 41 18 48 85 C0 74 09 48 8B 40 30 48 85 C0 75 07 48 8B 05 ? ? ? ?
AOB.GWorld.DispOffset = 0x15

# GEngine: also confirms UEngine::GameViewport = +0xC88 (cmp [rax+88 0C 00 00])
AOB.GEngine.Sig = 48 8B 05 ? ? ? ? 48 85 C0 0F 84 ? ? ? ? 48 39 98 88 0C 00 00
AOB.GEngine.DispOffset = 0x3


# =============================================================================
[Offsets]
# =============================================================================
# ---- RVAs (EXAMPLE set: one verified client build) ----
# These manual values override AOB results. Re-resolve them for your build.
GNames = 0xCE6CA30
GObjects = 0xCF3F260
GWorld = 0xD0CB998
GEngine = 0xD0CEC50

# ---- Alternate build RVAs (do not mix with the active set) ----
# GNames = 0xD1A9B68
# GObjects = 0xD2C62B0
# GWorld = 0xCFB1B00

# ---- GObjects / FUObjectItem ----
# FChunkedFixedUObjectArray header: +0x00 Objects, +0x10 Max,
# +0x14 Num, +0x18 MaxChunks, +0x1C NumChunks
# GUObjectArray.MaxElements = 0x10
# GUObjectArray.NumElements = 0x14
# GUObjectArray.MaxChunks   = 0x18
# GUObjectArray.NumChunks   = 0x1C
NumElementsPerChunk = 0x10000

# UObject members
UObject.Flags = 0x8
UObject.Index = 0xC
UObject.Class = 0x10
UObject.Name = 0x18
UObject.Outer = 0x20
UObject.Size = 0x18
# UObject* offset inside FUObjectItem. The chunk pointer may carry low tag bits;
# the dumper clears them. Stocks UE5 puts this at +0x00.
UObject.ItemObject = 0x10

# ---- FNamePool / FNameEntry (modified layout) ----
ChunkMask = 16
NameMask = 0xFFFF
# Blocks table offset from GNames. GNames may anchor either the pool object
# (+0x20) or the table itself (+0x10) depending on how it was resolved; both
# pairs address the same table.
NamePoolBlocksOffset = 0x20
# entry stride (stock UE5 = 2); header at entry+8, data at entry+0xC
NameEntryStride = 8
NameHeaderOffset = 0x8
NameDataOffset = 0xC
# kind byte == 2 -> fixed-length name (length taken from NameFixedKindLen
# instead of the header); set 0 to disable
NameFixedKind = 2
NameFixedKindLen = 22

# ---- everything else (auto-detected at runtime, rarely needed) ----
# FField.Class  = 0x8
# FName.Size = 0x8
# UProperty.ElementSize / ArrayDim / Offset / PropertyClass are value-probed
# at runtime (PropertyClass anchors on RootComponent -> SceneComponent).

# ---- FField layout (modified engine) ----
# The only change vs stock UE5: FFieldVariant shrunk from 16 to 8 bytes
# (pointer only, type tag removed), shifting Next 0x20 -> 0x18 and
# Name 0x28 -> 0x20. Class@0x8 / Owner@0x10 unchanged. The UStruct side
# (SuperStruct@0x40 / Children@0x48 / ChildProperties@0x50 /
# PropertiesSize@0x58) is stock. Manual values win over runtime probes.
FField.Owner = 0x10
FField.Next = 0x18
FField.Name = 0x20
FField.Flags = 0x28
